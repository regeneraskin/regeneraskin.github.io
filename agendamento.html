<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="assets/icone.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Lato:wght@400;700&display=swap" rel="stylesheet">

  <meta property="og:site_name" content="Regenera Skin">
  <meta property="og:title" content="Agende seu horário 🌸 Regenera Skin">
  <meta property="og:description" content="Escolha o dia e o horário que combinam melhor com a sua rotina.">
  <meta property="og:image" content="https://regeneraskin.github.io/assets/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <title>Agende seu horário · Regenera Skin</title>
</head>
<body>
  <div id="app"><div class="center-msg">Carregando horários…</div></div>
  <script type="module" src="js/agendamento.js?v=202610180434"></script>
  <script>
    // Se algo impedir o app de abrir, mostra um aviso em vez de carregar para sempre
    setTimeout(function () {
      var app = document.getElementById('app');
      if (app && app.querySelector('.center-msg') && /Carregando/.test(app.textContent)) {
        app.innerHTML = '<div class="center-msg">Está demorando mais que o normal… 🌸<br><br>' +
          '<button class="btn" onclick="location.reload()">Tentar de novo</button></div>';
      }
    }, 12000);
  </script>
</body>
</html>
